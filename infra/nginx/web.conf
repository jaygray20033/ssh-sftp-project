# ShellDeck — nginx INSIDE the `web` container.
# Serves the React SPA and proxies /api to the backend (HTTP + WebSocket).
# TLS is terminated in front of this container (see infra/nginx/host.conf and docs/deploy.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Keep the scheme from an HTTPS proxy in front of this container, else use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in sync with SFTP_MAX_UPLOAD_MB once the SFTP module is added.
    client_max_body_size 100m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API + WebSocket terminal (/api/v1/terminal/ws)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vite fingerprints asset file names: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
