# ShellDeck — OPTIONAL vhost for an nginx installed on the HOST (VPS), in front of the web container.
# Use it when the host already owns ports 80/443: set WEB_PORT=8081 in infra/docker/.env, then
#   cp host.conf /etc/nginx/conf.d/shelldeck.conf   (edit server_name), nginx -t, reload.
# Compatible with old nginx (1.14): no `http2 on;`, no map-only features.
# Add TLS with certbot (--nginx), then set COOKIE_SECURE=true and https:// URLs in infra/docker/.env.

map $http_upgrade $shelldeck_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name shelldeck.example.com;   # <TODO: your domain>

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shelldeck_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
